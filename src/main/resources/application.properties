# ==============================================================================
# Caption & Chapter Studio - Application Configuration
# ==============================================================================

server.port=8080

# Application Name
spring.application.name=caption-chapter-studio

# Active Profile:
# Default is 'h2' for instant zero-configuration local/college evaluation.
# Change to 'mysql' to connect to your local MySQL database!
spring.profiles.active=h2

# JSON Date Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Multipart upload limits if attachments are used
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
